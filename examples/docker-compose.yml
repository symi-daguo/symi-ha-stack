# Home Assistant + Matter Bridge production stack
#
# 运行在 Docker 或 Kiri 两种引擎上都可用 —— 用 engine.sh 切换。
#
# 所有路径来自 .env，复制 .env.example 为 .env 后填写。
#
# ⚠️ 关键约束（改动前必读，详见 docs/TROUBLESHOOTING.md）：
#   1. HA / Node-RED / Matter Hub 必须 network_mode: host
#      —— Matter 依赖 mDNS 多播，bridge 网络下控制器无法发现设备。
#   2. Mosquitto 用 bridge 网络 + 端口映射（1883/9001 只绑 127.0.0.1）。
#   3. Matter Hub 的 mDNS 必须限定在局域网网卡（--mdns-network-interface），
#      否则会把 docker0 / br-* / kiri* 等内部网卡的地址也写进广播，
#      控制器可能挑一个它到不了的地址，表现为"设备离线"。
#   4. Mosquitto 容器必须显式 user: "1883:1883"。
#      官方镜像 entrypoint 会 chown + 降权运行；Kiri 下容器内 root 读
#      0600 属主 1883 的配置文件会 EACCES → exit 3 无限重试。

name: ha-stack

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: ${CONTAINER_PREFIX}homeassistant
    hostname: home-assistant
    restart: unless-stopped

    # HA 必须用 host 网络模式（mDNS / SSDP / UPnP 多播）
    network_mode: host

    # 资源限制（HA 内存稳定在 600-800 MB；上限防止泄漏拖垮整机）
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    # 蓝牙适配器需要 NET_ADMIN / NET_RAW 才能 force stop scanner。
    # 缺这两个 cap 时 HA 每次启停都会刷几十条
    # "hci0 (xx:xx): Failed to force stop scanner" 错误。
    # 只加这两个，不给 privileged。
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      - ${STACK_DIR}/ha-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro    # HA 蓝牙 / 其他 DBus 服务

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ${CONTAINER_PREFIX}mosquitto
    hostname: mosquitto
    restart: unless-stopped

    # 显式指定用户（见文件头约束 4）。
    # 1883 = MQTT，9001 = WebSocket（HA Mosquitto integration 用）。
    user: "1883:1883"

    # 用 bridge 网络（不 host）：MQTT 只需要本机可达。
    # 改成 "0.0.0.0:1883:1883" 可让 LAN 设备接入。
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"

    mem_limit: 128m
    cpus: 0.5

    volumes:
      - ${STACK_DIR}/mosquitto/config:/mosquitto/config
      - ${STACK_DIR}/mosquitto/data:/mosquitto/data
      - ${STACK_DIR}/mosquitto/log:/mosquitto/log

    healthcheck:
      test: ["CMD", "sh", "-c", "mosquitto_pub -h 127.0.0.1 -u ${MQTT_USER:-ha_user} -P \"$$(cat /mosquitto/config/.ha_mqtt_password)\" -t '$$SYS/broker/uptime' -m ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nodered:
    image: nodered/node-red:latest
    container_name: ${CONTAINER_PREFIX}nodered
    hostname: nodered
    restart: unless-stopped

    # Node-RED 用 host 网络（和 HA 同网段，方便访问 HA / 局域网设备）
    network_mode: host

    mem_limit: 512m
    cpus: 1.0

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_OPTIONS: --max-old-space-size=256

    volumes:
      - ${STACK_DIR}/nodered-data:/data

    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  matter-hub:
    # 上游官方镜像（https://github.com/riddix/home-assistant-matter-hub）
    # 稳定版 1.7.x 已支持 --mdns-network-interface / --mdns-strip-global-ipv6。
    image: ghcr.io/riddix/home-assistant-matter-hub:${MATTER_HUB_VERSION:-1.7.18}
    container_name: ${CONTAINER_PREFIX}matter-hub
    hostname: matter-hub
    restart: unless-stopped

    # Matter 强制 host 网络（mDNS / UDP 5540）
    network_mode: host

    mem_limit: 512m
    cpus: 1.0

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HAMH_HOME_ASSISTANT_URL: http://127.0.0.1:8123/
      # HA long-lived access token。compose 不支持 $(cat ...)，走 .env。
      HAMH_HOME_ASSISTANT_ACCESS_TOKEN: ${HAMH_HA_TOKEN}
      HAMH_LOG_LEVEL: ${MATTER_LOG_LEVEL:-info}
      HAMH_HTTP_PORT: 8482
      # Used by the command below.
      MDNS_INTERFACE: ${MDNS_INTERFACE:?set MDNS_INTERFACE in .env}
      # Extra CLI flags, e.g. "--mdns-strip-global-ipv6"
      MATTER_HUB_EXTRA_ARGS: ${MATTER_HUB_EXTRA_ARGS:-}
      # 镜像原 CMD 是一段按可用内存算堆大小的 shell 脚本；
      # 这里 command 覆盖了它，所以堆大小要显式给。
      # 算法：cgroup 512m → 512/2 = 256，下限 256（与原脚本一致）。
      NODE_OPTIONS: --max-old-space-size=256

    # Shell form on purpose: it lets MATTER_HUB_EXTRA_ARGS be empty without
    # passing an empty argument to the CLI (which the tool rejects).
    #
    # --mdns-network-interface pins mDNS to the LAN interface; without it
    # Matter also advertises docker0 / br-* / kiri* addresses, and a
    # controller may pick one it cannot reach.
    #
    # --mdns-strip-global-ipv6 drops the global IPv6 (GUA) from the
    # advertisement. It exists in upstream master / 2.0.45+ but NOT in the
    # published 1.x / 2.0.7 images — passing it there makes the container
    # exit with "Unknown arguments". Enable it only when devices show
    # "No Response" and your interface carries a GUA address
    # (see docs/TROUBLESHOOTING.md).
    command:
      - /bin/sh
      - -c
      - |
        exec home-assistant-matter-hub start \
          --mdns-network-interface="$${MDNS_INTERFACE}" \
          $${MATTER_HUB_EXTRA_ARGS}

    volumes:
      - ${STACK_DIR}/matter-hub-data:/data
      - /etc/localtime:/etc/localtime:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8482/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
