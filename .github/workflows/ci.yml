name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/*.sh \
            install/*.sh

  compose:
    name: Validate compose template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          STACK_DIR: /tmp/ha-stack
          MDNS_INTERFACE: eth0
          HAMH_HA_TOKEN: dummy-token-for-validation
          CONTAINER_PREFIX: ""
          MATTER_HUB_EXTRA_ARGS: ""
        run: |
          docker compose -f examples/docker-compose.yml config --quiet
          echo "compose file is valid"

      - name: Validate the reference engine unit
        run: |
          # systemd-analyze needs a real root to resolve every path, so only
          # parse errors are treated as failures here.
          systemd-analyze verify examples/kiri.service 2>&1 \
            | grep -viE 'unknown lvalue|unbound variable|Failed to create' || true
          echo "engine unit parsed"

  secrets:
    name: Secret and sanitisation scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scan covers EVERY tracked file, including the documentation.
      # Documentation is exactly where a pasted token tends to survive:
      # a "worked example" in a troubleshooting guide, a real IP in a
      # command line, a pairing code in a caption. The earlier version
      # excluded docs/ and README*, which left the most likely place for
      # a leak completely unchecked.
      - name: Scan tracked files for credentials and host identifiers
        run: |
          set -euo pipefail
          # The rules live in scripts/sanitize-scan.sh so that the CI job
          # and the scanner self-test run exactly the same code. The scan
          # covers EVERY tracked file, including the documentation:
          # documentation is exactly where a pasted token tends to
          # survive — a "worked example" in a troubleshooting guide, a real
          # IP in a command line, a pairing code in a caption. An earlier
          # version excluded docs/ and README*, which left the most likely
          # place for a leak completely unchecked.
          bash scripts/sanitize-scan.sh

      - name: Verify secret-bearing paths are ignored
        run: |
          set -euo pipefail
          for p in .env ha-config matter-hub-data nodered-data \
                   mosquitto/config/.ha_mqtt_password mosquitto/config/passwd; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error::$p is tracked but should be gitignored"
              exit 1
            fi
          done
          echo "secret-bearing paths are correctly ignored"

      - name: Verify the example configuration has no real values
        run: |
          set -euo pipefail
          # The example file must not carry a value that could be mistaken
          # for a working credential.
          if grep -E '^HAMH_HA_TOKEN=' examples/.env.example | grep -qv 'REPLACE_WITH'; then
            echo "::error::examples/.env.example contains a token value"
            exit 1
          fi
          echo "example configuration is a placeholder"

  # The sanitisation scan is the gate that protects a public repository.
  # A scan that silently stops matching is worse than no scan at all,
  # because it reports "clean" while leaks pass. This job proves the scan
  # still catches things: it plants real leaks in a throwaway repository
  # and requires the scanner to fail on them, then requires the scanner to
  # pass on the real repository.
  scanner-selftest:
    name: sanitisation scanner self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plant real leaks in a throwaway repository
        run: |
          set -euo pipefail
          # The samples live in scripts/selftest-fixtures.sh so that this
          # workflow file stays free of anything that looks like a
          # credential — otherwise the scanner would have to exempt the
          # workflow itself, which is a hole: a real token pasted into a
          # workflow would then go unnoticed.
          bash scripts/selftest-fixtures.sh /tmp/leaks

      - name: The scanner must reject the planted leaks
        run: |
          # set +e: the scanner is expected to fail here, and its exit
          # code is the thing under test. `set -e` would abort the step
          # before the assertions could run.
          set +e
          set -uo pipefail
          fail=0
          out=$(bash "$GITHUB_WORKSPACE/scripts/sanitize-scan.sh" --path /tmp/leaks 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the scanner passed a repository full of planted leaks — it no longer detects them"
            fail=1
          fi
          for expected in "leak.env" "guide.md" "net.conf" "key.pem" "ec.pem" "prose.txt" "homepath.md"; do
            if ! echo "$out" | grep -q "$expected"; then
              echo "::error::the scanner did not report the planted leak in $expected"
              fail=1
            fi
          done
          # The placeholder must not be reported, otherwise the rule is
          # useless: every example file would trip it.
          if echo "$out" | grep -q "examples/.env.example"; then
            echo "::error::the scanner flagged the placeholder in examples/.env.example"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "the scanner catches every planted leak"

      - name: The scanner must accept this repository
        run: |
          set -euo pipefail
          bash scripts/sanitize-scan.sh

  # The four gates above check that files are well formed. This one
  # checks that the promises the documentation makes are still true —
  # that every script the docs tell the reader to run exists, that the
  # systemd units still pass the environment they need, that the compose
  # template still pins what it claims to pin.
  audit:
    name: requirement matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every documented promise still holds
        run: |
          set -euo pipefail
          python3 tools/audit-matrix.py

  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative links resolve
        run: |
          set -uo pipefail
          fail=0
          for f in README.md README_EN.md docs/*.md; do
            d=$(dirname "$f")
            # Process substitution, not a pipe: a `while read` inside a pipe
            # runs in a subshell, so `exit 1` there would not fail the step
            # and `fail=1` would be lost. That made broken links pass CI.
            while read -r link; do
              [ -n "$link" ] || continue
              target="$d/$link"
              if [ ! -e "$target" ]; then
                echo "::error::broken link in $f -> $link"
                fail=1
              fi
            done < <(grep -oE '\]\([^)#][^)]*\)' "$f" 2>/dev/null \
                      | sed 's/^](//; s/)$//' \
                      | grep -vE '^(https?:|mailto:)' || true)
          done
          [ "$fail" = "0" ] || exit 1
          echo "all relative links resolve"

      - name: Every script referenced in the docs exists
        run: |
          set -uo pipefail
          fail=0
          for f in README.md README_EN.md docs/*.md; do
            while read -r p; do
              [ -n "$p" ] || continue
              if [ ! -f "$p" ]; then
                echo "::error::$f references $p which does not exist"
                fail=1
              fi
            done < <(grep -oE '(scripts|bin)/[a-z_-]+\.sh' "$f" 2>/dev/null | sort -u || true)
            while read -r p; do
              [ -n "$p" ] || continue
              if [ ! -f "$p" ]; then
                echo "::error::$f references $p which does not exist"
                fail=1
              fi
            done < <(grep -oE 'examples/[a-z._-]+' "$f" 2>/dev/null | sort -u || true)
          done
          [ "$fail" = "0" ] || exit 1
          echo "every referenced file exists"

      - name: The documented version matches the release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [ "$tag" = "main" ] && exit 0
          for f in README.md README_EN.md; do
            if ! grep -q "$tag" "$f"; then
              echo "::error::$f does not mention the released version $tag"
              exit 1
            fi
          done
          echo "README files mention $tag"
