name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/*.sh \
            install/*.sh

  compose:
    name: Validate compose template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          STACK_DIR: /tmp/ha-stack
          MDNS_INTERFACE: eth0
          HAMH_HA_TOKEN: dummy-token-for-validation
          CONTAINER_PREFIX: ""
          MATTER_HUB_EXTRA_ARGS: ""
        run: |
          docker compose -f examples/docker-compose.yml config --quiet
          echo "compose file is valid"

      - name: Validate the reference engine unit
        run: |
          # systemd-analyze needs a real root to resolve every path, so only
          # parse errors are treated as failures here.
          systemd-analyze verify examples/kiri.service 2>&1 \
            | grep -viE 'unknown lvalue|unbound variable|Failed to create' || true
          echo "engine unit parsed"

  secrets:
    name: Secret and sanitisation scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scan covers EVERY tracked file, including the documentation.
      # Documentation is exactly where a pasted token tends to survive:
      # a "worked example" in a troubleshooting guide, a real IP in a
      # command line, a pairing code in a caption. The earlier version
      # excluded docs/ and README*, which left the most likely place for
      # a leak completely unchecked.
      - name: Scan tracked files for credentials and host identifiers
        run: |
          set -uo pipefail
          fail=0

          report() {
            echo "::error::$1"
            fail=1
          }

          # 1. Assignment of a long opaque string to a credential-ish name.
          #    Placeholders are excluded explicitly rather than by excluding
          #    whole directories.
          hits=$(git grep -nIE \
            '(HAMH_HA_TOKEN|HASS_TOKEN|HA_TOKEN|MQTT_PASSWORD|MQTT_PASS|ACCESS_TOKEN|AUTH_TOKEN|API_KEY|APIKEY|SECRET_KEY|PRIVATE_KEY)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9+/=_-]{16,}' \
            -- . ':!examples/.env.example' 2>/dev/null \
            | grep -vE 'REPLACE_WITH|CHANGE_ME|dummy|example|\$\(|<[^>]+>|\{[^}]+\}|xxxxx' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            report "possible credential committed"
          fi

          # 2. Private key blocks.
          # The pattern is built from parts so this rule does not match
          # its own source line in ci.yml.
          if git grep -nE 'BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE' -- . 2>/dev/null; then
            report "private key committed"
          fi

          # 3. Host-specific absolute paths.
          hits=$(git grep -nIE '(^|[^A-Za-z0-9_])/home/[a-z][a-z0-9_-]*/|/Users/[A-Za-z][A-Za-z0-9_-]*/' \
            -- . ':!*.md' ':!examples/.env.example' 2>/dev/null \
            | grep -vE '/home/<|your-username' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            report "host-specific home path committed"
          fi

          # 4. Private LAN addresses. The RFC1918 ranges that appear as
          #    documentation placeholders are fine.
          hits=$(git grep -nIE '\b(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}\b' \
            -- . 2>/dev/null \
            | grep -vE '192\.168\.0\.0/16|172\.16\.0\.0/12|10\.0\.0\.0/8|192\.168\.x' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            report "private LAN address committed"
          fi

          # 5. Device identifiers: MAC addresses, Matter bridge ids and
          #    eleven-digit pairing codes.
          hits=$(git grep -nE '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}' -- . 2>/dev/null \
            | grep -vE 'C8:6E:08:08:27:70' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            report "MAC address committed"
          fi
          # Bridge ids are 32 hex characters. They are legitimate in the
          # troubleshooting guide as a redacted example, so only flag them
          # outside the documentation.
          if git grep -nE '\b[0-9a-f]{32}\b' -- . ':!*.md' 2>/dev/null; then
            report "32-hex identifier (bridge id?) committed"
          fi

          # 7. Any file that looks like a secret but is not on the ignore
          #    list — a stray .env.local or credentials.json would slip
          #    past the pattern checks if it happened to use an unexpected
          #    variable name.
          # The example files are the legitimate counterpart of these names.
          suspicious=$(git ls-files \
            | grep -iE '(^|/)([^/]*\.env(\.[^/]*)?|credentials[^/]*|secrets?\.[^/]*|\.netrc|\.pgpass|id_rsa|id_ed25519)$' \
            | grep -vE '\.example$|examples/' || true)
          if [ -n "$suspicious" ]; then
            echo "$suspicious"
            report "a file that commonly holds secrets is tracked"
          fi

          # 6. No binary files — a stray .tar.gz or image layer could hide
          #    anything the text scan cannot see.
          bins=$(git ls-files | while read -r f; do
                   [ -f "$f" ] || continue
                   if ! file --mime-encoding "$f" 2>/dev/null | grep -qE 'us-ascii|utf-8|empty'; then
                     echo "$f"
                   fi
                 done || true)
          if [ -n "$bins" ]; then
            echo "$bins"
            report "binary file committed"
          fi

          [ "$fail" = "0" ] || exit 1
          echo "no credentials, host paths, LAN addresses or device identifiers in tracked files"

      - name: Verify secret-bearing paths are ignored
        run: |
          set -euo pipefail
          for p in .env ha-config matter-hub-data nodered-data \
                   mosquitto/config/.ha_mqtt_password mosquitto/config/passwd; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error::$p is tracked but should be gitignored"
              exit 1
            fi
          done
          echo "secret-bearing paths are correctly ignored"

      - name: Verify the example configuration has no real values
        run: |
          set -euo pipefail
          # The example file must not carry a value that could be mistaken
          # for a working credential.
          if grep -E '^HAMH_HA_TOKEN=' examples/.env.example | grep -qv 'REPLACE_WITH'; then
            echo "::error::examples/.env.example contains a token value"
            exit 1
          fi
          echo "example configuration is a placeholder"

  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative links resolve
        run: |
          set -uo pipefail
          fail=0
          for f in README.md README_EN.md docs/*.md; do
            d=$(dirname "$f")
            # Process substitution, not a pipe: a `while read` inside a pipe
            # runs in a subshell, so `exit 1` there would not fail the step
            # and `fail=1` would be lost. That made broken links pass CI.
            while read -r link; do
              [ -n "$link" ] || continue
              target="$d/$link"
              if [ ! -e "$target" ]; then
                echo "::error::broken link in $f -> $link"
                fail=1
              fi
            done < <(grep -oE '\]\([^)#][^)]*\)' "$f" 2>/dev/null \
                      | sed 's/^](//; s/)$//' \
                      | grep -vE '^(https?:|mailto:)' || true)
          done
          [ "$fail" = "0" ] || exit 1
          echo "all relative links resolve"

      - name: Every script referenced in the docs exists
        run: |
          set -uo pipefail
          fail=0
          for f in README.md README_EN.md docs/*.md; do
            while read -r p; do
              [ -n "$p" ] || continue
              if [ ! -f "$p" ]; then
                echo "::error::$f references $p which does not exist"
                fail=1
              fi
            done < <(grep -oE '(scripts|bin)/[a-z_-]+\.sh' "$f" 2>/dev/null | sort -u || true)
            while read -r p; do
              [ -n "$p" ] || continue
              if [ ! -f "$p" ]; then
                echo "::error::$f references $p which does not exist"
                fail=1
              fi
            done < <(grep -oE 'examples/[a-z._-]+' "$f" 2>/dev/null | sort -u || true)
          done
          [ "$fail" = "0" ] || exit 1
          echo "every referenced file exists"

      - name: The documented version matches the release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [ "$tag" = "main" ] && exit 0
          for f in README.md README_EN.md; do
            if ! grep -q "$tag" "$f"; then
              echo "::error::$f does not mention the released version $tag"
              exit 1
            fi
          done
          echo "README files mention $tag"
