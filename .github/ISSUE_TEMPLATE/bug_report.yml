name: Bug report
description: Something in the stack does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful bugs here come with the
        symptom *and* the evidence that identifies the cause.

  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What did you expect, and what happened instead?
      placeholder: |
        mosquitto container exits with code 3 every few seconds
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Evidence
      description: |
        Paste the output that identifies the cause. Useful sources:
        - `journalctl -u kiri.service -n 50`
        - `dmesg | grep -i apparmor | tail -20`
        - `docker compose logs --tail 50 <service>`
        - `iptables -S DOCKER-USER`
        - `ss -tln`
      render: shell
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Engine
      description: Which container engine was running?
      placeholder: Kiri 0.2.1 / Docker 27.x
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Host OS
      placeholder: Ubuntu 24.04 / Debian 12 / Raspberry Pi OS
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: |
        The compose file, `.env` with secrets removed, and any systemd unit
        you changed. Please redact tokens and passwords.
      render: yaml
